{{- define "main" }}
<article class="post-single author-page">
  <header class="post-header">
    <h1>{{ .Params.authorName | default .Title }}</h1>
    {{- with .Params.authorTitle }}<div class="post-description">{{ . }}</div>{{ end }}
  </header>

  {{- with .Resources.GetMatch .Params.authorImage }}
  <figure class="author-page-image">
    <img src="{{ .RelPermalink }}" alt="{{ $.Params.authorName }}">
  </figure>
  {{- end }}

  {{- with .Params.authorBio }}
  <div class="post-content">{{ . | markdownify }}</div>
  {{- end }}

</article>
{{- end }}
